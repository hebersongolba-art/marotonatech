<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treine sua própria IA de Inglês</title>
    <style>
        :root {
            --primary: #4a148c;
            --secondary: #7c4dff;
            --bg: #f5f5f7;
            --card: #ffffff;
            --text: #212121;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 600px;
            width: 100%;
            padding: 25px;
        }

        h2 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 20px;
        }

        .section {
            background: #fcfaff;
            border: 1px solid #e1d5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .section h3 {
            font-size: 1rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        button:hover {
            background: var(--secondary);
        }

        .chat-output {
            background: #f1f3f4;
            padding: 12px;
            border-radius: 6px;
            min-height: 50px;
            margin-top: 10px;
            font-size: 0.95rem;
            white-space: pre-line;
        }

        .memory-tag {
            display: inline-block;
            background: #e1d5f5;
            color: var(--primary);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🧠 Painel de Treinamento da IA</h2>
        <p style="font-size: 0.9rem; text-align: center; margin-bottom: 25px; color: #666;">
            Ensine regras ou respostas de inglês para a sua inteligência artificial local.
        </p>

        <!-- 1. PARTE PARA ENSINAR A IA -->
        <div class="section">
            <h3>1. Ensinar Nova Regra/Palavra (Inputs de Treino)</h3>
            <input type="text" id="trigger-input" placeholder="Quando o usuário disser... (Ex: 'Simple Present')">
            <textarea id="response-input" rows="2" placeholder="A IA deve responder... (Ex: 'Adicione S para He, She, It!')"></textarea>
            <button onclick="trainAI()">Salvar na Memória da IA</button>
            <div id="memory-list" style="margin-top: 10px;"></div>
        </div>

        <!-- 2. PARTE PARA TESTAR A IA -->
        <div class="section">
            <h3>2. Testar o Aprendizado da IA</h3>
            <input type="text" id="test-input" placeholder="Digite algo para ver se ela aprendeu..." onkeypress="checkEnter(event)">
            <button onclick="testAI()" style="background: #007bc4;">Enviar Pergunta</button>
            
            <div class="chat-output" id="chat-box">
                <em>A resposta da IA aparecerá aqui...</em>
            </div>
        </div>
    </div>

    <script>
        // Banco de dados local na memória do navegador (Objeto chave-valor)
        let aiMemory = {
            "olá": "Olá Professor! O que vamos estudar ou treinar hoje?",
            "hello": "Hello! I am ready to learn more English rules with you."
        };

        function trainAI() {
            const trigger = document.getElementById('trigger-input').value.trim().toLowerCase();
            const response = document.getElementById('response-input').value.trim();

            if (trigger === "" || response === "") {
                alert("Por favor, preencha o que o usuário diz e qual deve ser a resposta da IA.");
                return;
            }

            // Salva na memória
            aiMemory[trigger] = response;
            
            // Limpa os campos
            document.getElementById('trigger-input').value = "";
            document.getElementById('response-input').value = "";
            
            updateMemoryUI();
            alert("Sucesso! A IA aprendeu esse comando.");
        }

        function updateMemoryUI() {
            const list = document.getElementById('memory-list');
            list.innerHTML = "<strong>Memória Atual:</strong><br>";
            for (let key in aiMemory) {
                list.innerHTML += `<span class="memory-tag">"${key}"</span>`;
            }
        }

        function checkEnter(event) {
            if (event.key === 'Enter') testAI();
        }

        function testAI() {
            const testInput = document.getElementById('test-input').value.trim().toLowerCase();
            const chatBox = document.getElementById('chat-box');

            if (testInput === "") return;

            let foundResponse = "Desculpe, ainda não fui treinada para entender essa palavra ou comando. Pode me ensinar na seção acima?";

            // Procura na memória se existe alguma palavra-chave correspondente
            for (let key in aiMemory) {
                if (testInput.includes(key)) {
                    foundResponse = aiMemory[key];
                    break;
                }
            }

            chatBox.innerHTML = `<strong>Você:</strong> ${testInput}<br><strong>IA:</strong> ${foundResponse}`;
            document.getElementById('test-input').value = "";
        }

        // Inicializa mostrando o que ela já sabe por padrão
        updateMemoryUI();
    </script>

</body>
</html>
