<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar no Inglês Paraná</title>
    <style>
        :root {
            --primary-color: #0f4c81;
            --secondary-color: #1f7a8c;
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-color: #2b2d42;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            max-width: 440px;
            width: 100%;
            text-align: center;
            border-top: 6px solid var(--primary-color);
        }

        .login-card h2 {
            color: var(--primary-color);
            margin-bottom: 12px;
            font-size: 1.6rem;
        }

        .login-card p {
            font-size: 0.95rem;
            color: #5c677d;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--primary-color);
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--secondary-color);
        }

        .btn-launch {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-launch:hover {
            opacity: 0.95;
        }

        .security-footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #94a3b8;
            line-height: 1.4;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Acesso ao Inglês Paraná</h2>
        <p>Insira seus dados institucionais abaixo para abrir a página oficial de autenticação da sua conta de estudante.</p>
        
        <div class="input-group">
            <label for="student-email">E-mail @escola:</label>
            <input type="email" id="student-email" placeholder="nome.sobrenome@escola.pr.gov.br" required>
        </div>

        <div class="input-group">
            <label for="student-password">Senha institucional:</label>
            <input type="password" id="student-password" placeholder="Digite sua senha de estudante" required>
        </div>

        <button class="btn-launch" onclick="launchPlatform()">Abrir Minhas Lições</button>

        <div class="security-footer">
            🔒 <strong>Conexão Criptografada:</strong> A validação de usuário e senha ocorre dentro do ambiente institucional seguro da Secretaria de Educação.
        </div>
    </div>

    <script>
        function launchPlatform() {
            const email = document.getElementById('student-email').value.trim();
            const password = document.getElementById('student-password').value.trim();
            
            if (email === "" || password === "") {
                alert("Por favor, preencha os campos de e-mail e senha para continuar.");
                return;
            }

            if (!email.includes("@escola")) {
                alert("Por favor, utilize um e-mail válido com a extensão institucional @escola.");
                return;
            }
            
            // Redirecionamento direto para a central integrada de login oficial da SEED-PR
            window.location.href = "https://educacao.pr.gov.br"; 
        }
    </script>

</body>
</html>
