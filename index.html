<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroSeguro - Protegendo a Tecnologia do Campo</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* --- ESTILOS GERAIS E PALETA DE CORES (AGRO TECH) --- */
        :root {
            --primary: #1e4620;        /* Verde Folha Escuro */
            --primary-light: #2d6a30;  /* Verde Intermediário */
            --secondary: #e65c00;      /* Laranja Alerta/Inovação */
            --accent: #f4f9f4;         /* Fundo Verde Bem Claro */
            --dark: #212529;           /* Texto Escuro */
            --gray: #6c757d;           /* Texto Secundário */
            --white: #ffffff;
            --danger: #d90429;         /* Vermelho Alerta Máximo */
            --warning: #ffb703;        /* Amarelo Atenção */
            --success: #2b9348;        /* Verde Seguro */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: #fafafa;
            color: var(--dark);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        h2.section-title {
            text-align: center;
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 10px;
            font-weight: 700;
        }

        p.section-subtitle {
            text-align: center;
            color: var(--gray);
            max-width: 700px;
            margin: 0 auto 50px auto;
            font-size: 1.1rem;
        }

        section {
            padding: 80px 0;
        }

        /* --- CABEÇALHO (NAVIGATION) --- */
        header {
            background-color: var(--white);
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        h1.logo {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary);
        }

        h1.logo span {
            color: var(--secondary);
        }

        nav a {
            text-decoration: none;
            color: var(--dark);
            font-weight: 500;
            margin-left: 30px;
            transition: color 0.3s;
            font-size: 0.95rem;
        }

        nav a:hover {
            color: var(--secondary);
        }

        /* --- HERO SECTION --- */
        .hero {
            background: linear-gradient(135deg, rgba(30,70,32,0.95) 0%, rgba(15,35,16,0.98) 100%), 
                        url('https://unsplash.com') no-repeat center center/cover;
            color: var(--white);
            text-align: center;
            padding: 120px 0;
        }

        .hero h2 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .hero p {
            font-size: 1.25rem;
            max-width: 800px;
            margin: 0 auto;
            color: #e0eae0;
            font-weight: 300;
        }

        /* --- SEÇÃO: O PROBLEMA (VULNERABILIDADES) --- */
        #problema {
            background-color: var(--white);
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--white);
            border-left: 5px solid var(--secondary);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
        }

        .card h3 {
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .card p {
            color: var(--gray);
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .impact-badge {
            display: inline-block;
            background-color: #fff0e6;
            color: var(--secondary);
            padding: 5px 12px;
            border-radius: 5px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* --- SEÇÃO: ARTEFATO DIGITAL (FRAMEWORK) --- */
        #artefato {
            background-color: var(--accent);
        }

        .framework-timeline {
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-width: 900px;
            margin: 0 auto;
        }

        .timeline-step {
            background: var(--white);
            padding: 25px;
            border-radius: 8px;
            display: flex;
            align-items: flex-start;
            gap: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .step-number {
            background: var(--primary);
            color: var(--white);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            flex-shrink: 0;
        }

        .step-content h3 {
            color: var(--primary);
            margin-bottom: 8px;
        }

        /* --- SEÇÃO: SOLUÇÕES PRÁTICAS --- */
        #solucoes {
            background-color: var(--white);
        }

        .solucoes-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .solucao-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 6px;
            border-top: 4px solid var(--primary-light);
        }

        .solucao-item h4 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        /* --- SEÇÃO: TERMÔMETRO DE RISCO (SIMULADOR) --- */
        #simulador {
            background-color: var(--accent);
        }

        .simulator-box {
            background: var(--white);
            max-width: 750px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.06);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            background-color: var(--white);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group select:focus {
            border-color: var(--primary-light);
        }

        .btn-calc {
            display: block;
            width: 100%;
            background-color: var(--secondary);
            color: var(--white);
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-calc:hover {
            background-color: #cc5200;
        }

        /* RESULTADO DO SIMULADOR */
        #resultado {
            margin-top: 30px;
            padding: 25px;
            border-radius: 8px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .resultado-titulo {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .recomendacoes-lista {
            margin-top: 15px;
            padding-left: 20px;
        }

        .recomendacoes-lista li {
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        /* Classes dinâmicas para o resultado */
        .status-alto {
            background-color: #fff0f1;
            border: 2px solid var(--danger);
            color: #800010;
        }
        .status-medio {
            background-color: #fffbeb;
            border: 2px solid var(--warning);
            color: #7a5c00;
        }
        .status-baixo {
            background-color: #f2fbf4;
            border: 2px solid var(--success);
            color: #1b5e20;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- FOOTER --- */
        footer {
            background-color: var(--primary);
            color: var(--white);
            text-align: center;
            padding: 30px 0;
            font-size: 0.9rem;
        }

        /* --- RESPONSIVIDADE --- */
        @media (max-width: 768px) {
            header .container {
                flex-direction: column;
                height: auto;
                padding: 15px;
                gap: 10px;
            }
            nav a {
                margin: 0 10px;
            }
            .hero h2 {
                font-size: 2rem;
            }
            .simulator-box {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <header>
        <div class="container">
