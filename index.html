<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Seguro - Inglês Paraná Highs</title>
    <style>
        :root {
            --primary-color: #003366;
            --secondary-color: #0066cc;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 420px;
            width: 100%;
            text-align: center;
            border-top: 6px solid var(--primary-color);
        }

        .login-card h2 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 1.6rem;
        }

        .login-card p {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--primary-color);
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #dcdcdc;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--secondary-color);
        }

        .btn-redirect {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-redirect:hover {
            opacity: 0.95;
        }

        .security-notice {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #888;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Inglês Paraná Highs</h2>
        <p>Insira suas informações institucionais para abrir com segurança a plataforma oficial de lições.</p>
        
        <div class="input-group">
            <label for="email">E-mail @escola:</label>
            <input type="email" id="email" placeholder="seu.nome@escola.pr.gov.br" required>
        </div>

        <div class="input-group">
            <label for="password">Senha institucional:</label>
            <input type="password" id="password" placeholder="Digite sua senha institucional" required>
        </div>

        <button class="btn-redirect" onclick="processAccess()">Entrar no Inglês Paraná</button>

        <p class="security-notice">
            🔒 <strong>Aviso de Segurança:</strong> Seus dados de login são protegidos e validados diretamente pelo servidor integrado oficial da SEED-PR.
        </p>
    </div>

    <script>
        function processAccess() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (email === "" || password === "") {
                alert("Por favor, preencha todos os campos obrigatórios.");
                return;
            }

            if (!email.includes("@escola")) {
                alert("Por favor, insira um e-mail institucional válido (@escola.pr.gov.br).");
                return;
            }
            
            // Redireciona de forma direta e segura para a central de autenticação e plataformas oficiais
            window.location.href = "https://educacao.pr.gov.br"; 
        }
    </script>

</body>
</html>
