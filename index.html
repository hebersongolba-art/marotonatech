<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Automação - Inglês Paraná</title>
    <style>
        /* Estilização do painel flutuante */
        .painel-automacao {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 280px;
            background-color: #1e1e24;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 99999;
            padding: 15px;
            border: 1px solid #3a3a4a;
        }
        .painel-titulo {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            color: #4caf50;
            border-bottom: 1px solid #3a3a4a;
            padding-bottom: 5px;
        }
        .status-container {
            font-size: 12px;
            margin-bottom: 15px;
            background: #2a2a35;
            padding: 8px;
            border-radius: 4px;
        }
        .status-log {
            color: #ffd700;
            font-weight: bold;
        }
        .btn-controle {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-ligar {
            background-color: #4caf50;
            color: white;
        }
        .btn-ligar:hover { background-color: #45a049; }
        .btn-desligar {
            background-color: #f44336;
            color: white;
            display: none;
        }
        .btn-desligar:hover { background-color: #da190b; }
    </style>
</head>
<body>

    <!-- Estrutura HTML do Painel que ficará visível na tela -->
    <div class="painel-automacao" id="meuPainel">
        <div class="painel-titulo">🤖 ROBÔ INGLÊS PARANÁ</div>
        <div class="status-container">
            Status: <span id="statusTexto" class="status-log">Inativo</span><br>
            Último Índice: <span id="indiceTexto">-</span>
        </div>
        <button id="btnLigar" class="btn-controle btn-ligar" onclick="iniciarRobo()">LIGAR AUTOMAÇÃO</button>
        <button id="btnDesligar" class="btn-controle btn-desligar" onclick="pararRobo()">PARAR AUTOMAÇÃO</button>
    </div>

    <!-- Script JavaScript embutido que faz a mágica acontecer -->
    <script>
        let loopAutomacao = null;

        // Lista de índices com os seletores dos botões da plataforma
        const seletoresBotoes = [
            '.navigation-button--next', 
            '.btn-next',                
            'button.continue',          
            '.cloze-p-check-button',    
            '.modal-close',             
            '.btn-advance'              
        ];

        function iniciarRobo() {
            // Altera o estado visual dos botões no HTML
            document.getElementById('btnLigar').style.display = 'none';
            document.getElementById('btnDesligar').style.display = 'block';
            document.getElementById('statusTexto').innerText = 'Procurando botões...';
            document.getElementById('statusTexto').style.color = '#4caf50';

            // Inicia o ciclo de checagem a cada 4 segundos
            loopAutomacao = setInterval(() => {
                let botaoAchado = null;
                let indiceDetectado = -1;

                // Varre a lista de índices HTML da página do curso
                for (let i = 0; i < seletoresBotoes.length; i++) {
                    const elemento = document.querySelector(seletoresBotoes[i]);
                    if (elemento) {
                        botaoAchado = elemento;
                        indiceDetectado = i;
                        break; // Para o loop ao achar o primeiro botão ativo
                    }
                }

                // Se o script encontrar um botão mapeado pelo índice HTML
                if (botaoAchado && !botaoAchado.disabled) {
                    document.getElementById('indiceTexto').innerText = `Índice [${indiceDetectado}]`;
                    botaoAchado.click(); // Executa o clique
                } else {
                    document.getElementById('indiceTexto').innerText = "Nenhum na tela";
                }

            }, 4000);
        }

        function pararRobo() {
            // Restaura o painel HTML para o estado original
            clearInterval(loopAutomacao);
            document.getElementById('btnLigar').style.display = 'block';
            document.getElementById('btnDesligar').style.display = 'none';
            document.getElementById('statusTexto').innerText = 'Inativo';
            document.getElementById('statusTexto').style.color = '#ffd700';
            document.getElementById('indiceTexto').innerText = "-";
        }
    </script>
</body>
</html>
