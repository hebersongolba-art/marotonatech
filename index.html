<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Apoio - Inglês Paraná</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --secondary-color: #00b4d8;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --alert-color: #ff9f1c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h2 { color: var(--primary-color); }
        .header p { font-size: 0.9rem; color: #666; }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            resize: vertical;
        }

        input:focus, textarea:focus {
            border-color: var(--secondary-color);
        }

        .btn-solve {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .result-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background-color: #f8f9fa;
            border-left: 5px solid var(--alert-color);
            border-radius: 4px;
        }

        .result-title {
            font-weight: bold;
            color: #d9534f;
            margin-bottom: 10px;
        }

        .explanation {
            font-size: 0.95rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>Decodificador de Erros</h2>
            <p>Errou a questão? Cole o enunciado abaixo para entender a resposta correta imediatamente.</p>
        </div>

        <div class="input-group">
            <label for="student-id">Identificador (@escola):</label>
            <input type="text" id="student-id" placeholder="seu.nome@escola.pr.gov.br">
        </div>

        <div class="input-group">
            <label for="exercise-text">Cole a frase ou exercício que você errou:</label>
            <textarea id="exercise-text" rows="3" placeholder="Ex: She ______ (go) to school everyday."></textarea>
        </div>

        <button class="btn-solve" onclick="analyzeExercise()">Analisar e Corrigir</button>

        <div id="result-area" class="result-box">
            <div class="result-title">📢 Análise da Questão Acadêmica</div>
            <div class="explanation" id="explanation-text"></div>
        </div>
    </div>

    <script>
        function analyzeExercise() {
            const id = document.getElementById('student-id').value.trim();
            const text = document.getElementById('exercise-text').value.trim();

            if (id === "" || text === "") {
                alert("Por favor, preencha o seu @escola e cole a questão para análise.");
                return;
            }

            const resultArea = document.getElementById('result-area');
            const explanationText = document.getElementById('explanation-text');

            resultArea.style.display = 'block';
            
            // Simulação de análise gramatical pedagógica baseada em palavras-chave comuns
            explanationText.innerHTML = `
                <strong>Análise concluída para o usuário:</strong> ${id}<br><br>
                <strong>Dica de Resolução:</strong> Identificamos que este exercício trata de concordância verbal ou tempos simples.<br><br>
                1. Procure pelo <strong>sujeito</strong> da frase (Ex: He, She, They).<br>
                2. Se a frase contiver indicadores de rotina como <em>everyday</em> ou <em>always</em>, o verbo precisará receber "s" ou "es" se o sujeito for singular.<br><br>
                💡 <em>Copie e cole este mesmo enunciado na nossa conversa principal se precisar que eu te forneça a tradução exata e a alternativa correta agora mesmo!</em>
            `;
        }
    </script>

</body>
</html>
